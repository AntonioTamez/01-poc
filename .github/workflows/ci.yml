name: ci

# Validates the whole monorepo. Per-service workflows (e.g. orders.yml) handle delivery.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore Monorepo.slnx

      - name: Build
        run: dotnet build Monorepo.slnx --no-restore -c Release

      # Integration tests use Testcontainers; Docker is available on ubuntu-latest runners.
      - name: Test
        run: dotnet test --solution Monorepo.slnx --no-build -c Release
